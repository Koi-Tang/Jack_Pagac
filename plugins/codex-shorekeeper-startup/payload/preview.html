<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>守岸人 · 5秒转场预览</title><style>
html:not(.scene-visible) #root{visibility:hidden}*{box-sizing:border-box}body{margin:0;background:#1e201e;color:#e5e7e3;font:14px "Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}button,textarea{font:inherit}button{cursor:pointer}#root{height:100vh;display:grid;grid-template-columns:220px 1fr;transform-origin:60% 62%}aside{padding:23px 14px;background:#191b19;border-right:1px solid #ffffff06}.brand{display:flex;align-items:center;gap:9px;margin:0 7px 26px;font-size:16px;font-weight:600}.brand img{width:24px;height:24px;border-radius:6px}.nav{padding:11px 13px;margin-bottom:5px;color:#a9b0a8;border-radius:6px;font-size:13px}.nav.active{background:#2a2d28;color:#e6eae3}.nav span{margin-right:11px;color:#afb5ab}aside small{display:block;color:#686f65;font-size:10px;padding:26px 13px 11px}aside p{font-size:12px;color:#8e9589;margin:15px 13px}main{position:relative;display:grid;place-items:center;padding:28px}.landing{width:min(680px,88%);margin-top:-40px}.welcome{text-align:center;margin-bottom:34px}.welcome img{height:33px;width:33px;border-radius:9px;margin-bottom:14px}.welcome h1{font-size:27px;margin:0 0 9px;font-weight:550}.welcome p{font-size:13px;color:#92998f;margin:0}form{border:1px solid #ffffff0e;background:#292d28;border-radius:14px;padding:19px 20px 13px;box-shadow:0 4px 24px #00000012}textarea{border:0;resize:none;background:transparent;color:#dce2d7;width:100%;height:44px;outline:none}textarea::placeholder{color:#899480}form footer{display:flex;align-items:center;justify-content:space-between;color:#929c87;font-size:12px}.send{border:0;border-radius:50%;background:#737e68;color:#e5ebdd;width:27px;height:27px}.meta{position:absolute;bottom:22px;color:#6f7867;font-size:10px;text-align:center;line-height:1.7}.replay{position:absolute;right:22px;top:18px;padding:7px 12px;background:#2b3029;color:#a9b6a0;border:1px solid #ffffff0a;border-radius:5px;font-size:11px}@media(max-width:600px){#root{grid-template-columns:1fr}aside{display:none}.landing{width:1 </style></head><body><div id="root"><aside><div class="brand"><img src="assets/icon.ico" alt="">Codex</div><div class="nav active"><span>＋</span>新聊天</div><div class="nav"><span>⌕</span>搜索聊天</div><small>最近</small><p>守岸人启动动画</p><p>新的想法</p></aside><main><button class="replay" onclick="location.reload()">重播转场</button><div class="landing"><div class="welcome"><img src="assets/icon.ico" alt=""><h1>新聊天</h1><p>描述你想完成的任务</p></div><form onsubmit="return false"><textarea aria-label="向 Codex 发送消息" placeholder="向 Codex 发送消息…"></textarea><footer><span>＋</span><button class="send" type="button" aria-label="发送">↑</button></footer></form></div><div class="meta">5 秒转场预览 · 此处是用于展示衔接的测试界面<br>实际安装后，动画会衔接到你的真实 Codex 页面</div></main></div><script>const showPreviewPage=()=>document.documentElement.classList.add('scene-visible');document.addEventListener('shorekeeper-startup-visible',showPreviewPage);document.addEventListener('shorekeeper-startup-ready',()=>{if(window.__SHOREKEEPER_DEFER_REVEAL__!==true)showPreviewPage()});document.addEventListener('shorekeeper-startup-ended',showPreviewPage);</script><script src="preview-overlay.js"></script></body></html>
